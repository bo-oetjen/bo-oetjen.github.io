<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Bo Oetjen</title>
<script>
/* Short application links: bo-oetjen.com/<code> opens the home page and tags the visit
   with that code (Clarity custom tags source=application, campaign=<code>). */
(function(){
  var code = location.pathname.replace(/^\/+|\/+$/g, "").toLowerCase();
  if (/^[a-z0-9][a-z0-9-]{0,59}$/.test(code)) {
    location.replace("/?utm_source=application&utm_campaign=" + encodeURIComponent(code));
  } else {
    location.replace("/");
  }
})();
</script>
<style>body{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:48px 16px;text-align:center;color:#14212A;background:#F5F6F3}</style>
</head>
<body>
<p>Taking you to <a href="/">bo-oetjen.com</a>…</p>
</body>
</html>
